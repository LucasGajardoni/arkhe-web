name: Validate limits UI
on:
  pull_request:
    paths:
      - 'src/pages/Limites/**'
      - '.github/workflows/limites-ci.yml'
  push:
    branches:
      - 'fix/limites-conta-sem-teto-e-ux'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint src/pages/Limites/Limites.jsx
      - run: npm run build
