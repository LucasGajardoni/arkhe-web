name: Validate dashboard PJ layout
on:
  push:
    branches:
      - 'fix/centralizar-nav-pj-atalhos-20261026'
  pull_request:
    paths:
      - 'src/pages/Dashboard/Dashboard.css'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
