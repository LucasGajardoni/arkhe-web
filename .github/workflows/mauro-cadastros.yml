name: Validate Mauro operations
on:
  pull_request:
    paths:
      - 'src/components/Mauro/**'
      - 'src/pages/AdminBanco/MauroAdmin.jsx'
      - 'src/pages/Dashboard/Dashboard.jsx'
      - 'src/services/mauroService.js'
      - 'src/services/adminBancoService.js'
      - '.github/workflows/mauro-cadastros.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint src/components/Mauro/AssistenteMauro.jsx src/components/Mauro/PropostaCadastroMauro.jsx src/pages/AdminBanco/MauroAdmin.jsx src/pages/Dashboard/Dashboard.jsx src/services/mauroService.js src/services/adminBancoService.js
      - run: npm run build
